<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Calendrier économique — Crypto Fundamental Radar</title>
<style>
  :root {
    --bg: #0b1120; --panel: #111827; --row: #0f172a; --row-alt: #131c2e;
    --border: #1f2a3d; --txt: #e2e8f0; --muted: #64748b; --muted2: #94a3b8;
    --accent: #38bdf8; --up: #22c55e; --down: #ef4444; --amber: #f59e0b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--txt); font: 14px/1.5 ui-sans-serif, system-ui, sans-serif; padding: 24px; }
  header { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 4px; }
  h1 { font-size: 22px; font-weight: 700; }
  .sub { color: var(--muted2); font-size: 13px; }
  .meta { color: var(--muted); font-size: 12px; margin: 6px 0 18px; }
  .badge { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; }
  .badge.fmp { background: #064e3b; color: #6ee7b7; }
  .badge.fred { background: #422006; color: #fcd34d; }
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }
  .toolbar select, .toolbar button { background: var(--panel); color: var(--txt); border: 1px solid var(--border);
    border-radius: 8px; padding: 7px 10px; font-size: 13px; cursor: pointer; }
  .toolbar button:hover { border-color: var(--accent); }
  .wrap { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
  table { width: 100%; border-collapse: collapse; }
  thead th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted);
    padding: 10px 14px; border-bottom: 1px solid var(--border); background: #0d1526; position: sticky; top: 0; }
  th.num, td.num { text-align: right; font-variant-numeric: tabular-nums; }
  tbody td { padding: 9px 14px; border-bottom: 1px solid var(--border); }
  tr.day td { background: #0d1526; color: var(--muted2); font-weight: 700; font-size: 12px; text-transform: capitalize;
    letter-spacing: .03em; padding: 8px 14px; }
  tr.ev:nth-child(even) { background: var(--row-alt); }
  tr.ev.past { opacity: .62; }
  tr.ev.today td.time { color: var(--accent); font-weight: 700; }
  td.time { color: var(--muted2); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .flag { font-size: 16px; margin-right: 6px; }
  .ccy { color: var(--muted); font-size: 12px; }
  .imp { letter-spacing: 1px; font-size: 10px; }
  .imp.high { color: var(--down); } .imp.medium { color: var(--amber); } .imp.low { color: var(--muted); }
  .ev-name { font-weight: 500; }
  td.actual { font-weight: 700; }
  .up { color: var(--up); } .down { color: var(--down); }
  .dim { color: var(--muted); }
  .empty { padding: 40px; text-align: center; color: var(--muted); }
  footer { margin-top: 14px; color: var(--muted); font-size: 12px; }
  a { color: var(--accent); }
</style>
</head>
<body>
  <header>
    <h1>📅 Calendrier économique</h1>
    <span class="sub">Crypto Fundamental Radar</span>
  </header>
  <div class="meta" id="meta">Chargement…</div>

  <div class="toolbar">
    <select id="impact">
      <option value="all">Tous impacts</option>
      <option value="high">Impact élevé</option>
      <option value="medium">Moyen +</option>
    </select>
    <select id="country"><option value="all">Tous pays</option></select>
    <select id="when">
      <option value="all">Passés + à venir</option>
      <option value="upcoming">À venir seulement</option>
      <option value="past">Résultats publiés</option>
    </select>
    <button id="refresh">↻ Rafraîchir</button>
  </div>

  <div class="wrap">
    <table>
      <thead>
        <tr>
          <th>Heure</th><th>Pays</th><th>Imp.</th><th>Événement</th>
          <th class="num">Précédent</th><th class="num">Prévision</th><th class="num">Réel</th>
        </tr>
      </thead>
      <tbody id="rows"><tr><td colspan="7" class="empty">Chargement…</td></tr></tbody>
    </table>
  </div>
  <footer>Données : <span id="prov">—</span> · maj auto 60 s · multi-pays, heure, impact, précédent/prévision/<strong>réel</strong> (investing.com) + horizon US lointain &amp; FOMC (FRED). FairEconomy en repli.</footer>

<script>
const FLAGS = { US:"🇺🇸", EU:"🇪🇺", EA:"🇪🇺", CN:"🇨🇳", JP:"🇯🇵", GB:"🇬🇧", UK:"🇬🇧", DE:"🇩🇪",
  FR:"🇫🇷", IT:"🇮🇹", CA:"🇨🇦", AU:"🇦🇺", CH:"🇨🇭", IN:"🇮🇳", BR:"🇧🇷", KR:"🇰🇷", NZ:"🇳🇿" };
const IMP_RANK = { none:0, low:1, medium:2, high:3 };
let DATA = { events: [] };

const fmtNum = (v) => v == null ? '<span class="dim">—</span>' : (Math.abs(v) >= 1000 ? v.toLocaleString("fr-FR") : String(v));
const dayLabel = (d) => new Date(d + "T12:00:00Z").toLocaleDateString("fr-FR", { weekday:"long", day:"numeric", month:"long" });
const todayStr = () => new Date().toISOString().slice(0,10);
const fmtTime = (e) => e.datetime ? new Date(e.datetime).toLocaleTimeString("fr-FR", { hour:"2-digit", minute:"2-digit" }) : '<span class="dim">—</span>';

function actualCell(e) {
  if (e.actual == null) return '<span class="dim">—</span>';
  let cls = "";
  if (e.surprise != null && e.surprise !== 0) cls = e.surprise > 0 ? "up" : "down";
  return `<span class="${cls}">${fmtNum(e.actual)}</span>`;
}

function render() {
  const fImp = document.getElementById("impact").value;
  const fCty = document.getElementById("country").value;
  const fWhen = document.getElementById("when").value;
  const today = todayStr();
  const now = Date.now();

  let evs = DATA.events.slice();
  if (fImp !== "all") evs = evs.filter(e => IMP_RANK[e.impact] >= IMP_RANK[fImp]);
  if (fCty !== "all") evs = evs.filter(e => e.country === fCty);
  if (fWhen === "upcoming") evs = evs.filter(e => e.datetime >= now);
  if (fWhen === "past") evs = evs.filter(e => e.actual != null);

  const rows = document.getElementById("rows");
  if (!evs.length) { rows.innerHTML = '<tr><td colspan="7" class="empty">Aucun événement pour ce filtre.</td></tr>'; return; }

  let html = "", curDay = null;
  for (const e of evs) {
    if (e.date !== curDay) {
      curDay = e.date;
      html += `<tr class="day"><td colspan="7">${dayLabel(curDay)}${curDay===today?" · aujourd'hui":""}</td></tr>`;
    }
    const past = e.datetime < now;
    const dots = { high:"●●●", medium:"●●", low:"●" }[e.impact] || "";
    html += `<tr class="ev ${past?"past":""} ${e.date===today?"today":""}">
      <td class="time">${fmtTime(e)}</td>
      <td><span class="flag">${FLAGS[e.country]||"🏳️"}</span><span class="ccy">${e.country||""}</span></td>
      <td><span class="imp ${e.impact}">${dots}</span></td>
      <td class="ev-name">${e.event||""}</td>
      <td class="num">${fmtNum(e.previous)}</td>
      <td class="num">${fmtNum(e.forecast)}</td>
      <td class="num actual">${actualCell(e)}</td>
    </tr>`;
  }
  rows.innerHTML = html;
}

function fillCountries() {
  const sel = document.getElementById("country");
  const cur = sel.value;
  const set = [...new Set(DATA.events.map(e => e.country).filter(Boolean))].sort();
  sel.innerHTML = '<option value="all">Tous pays</option>' + set.map(c => `<option value="${c}">${FLAGS[c]||""} ${c}</option>`).join("");
  sel.value = cur;
}

async function load() {
  document.getElementById("meta").textContent = "Chargement…";
  try {
    const r = await fetch("/api/calendar");
    DATA = await r.json();
    const prov = DATA.rich ? `<span class="badge fmp">${(DATA.provider || "riche").toUpperCase()} — complet</span>` : '<span class="badge fred">FRED — US, sans prévision</span>';
    document.getElementById("meta").innerHTML =
      `${prov} · ${DATA.count} événements · source <code>${DATA.source}</code> · maj ${DATA.iso ? new Date(DATA.iso).toLocaleString("fr-FR") : "—"}`;
    document.getElementById("prov").textContent = DATA.provider?.toUpperCase() || "—";
    fillCountries();
    render();
  } catch (err) {
    document.getElementById("rows").innerHTML = `<tr><td colspan="7" class="empty">Erreur de chargement : ${err.message}</td></tr>`;
  }
}

["impact","country","when"].forEach(id => document.getElementById(id).addEventListener("change", render));
document.getElementById("refresh").addEventListener("click", load);
load();
setInterval(load, 60000);
</script>
</body>
</html>
